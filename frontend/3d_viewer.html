<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antarctic 3D View</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#060e1a;font-family:system-ui,sans-serif;color:#c8d6e5}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;z-index:10;background:rgba(8,14,26,.88);border:1px solid #1a2744;border-radius:8px;padding:12px 16px;max-width:260px}
#hud h2{font-size:14px;color:#e2e8f0;margin-bottom:6px}
#hud p{font-size:11px;color:#5a6d8a;line-height:1.4}
#hud a{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:5px;background:#1e3a5f;color:#38bdf8;font-size:10px;font-weight:600;text-decoration:none;transition:background .15s}
#hud a:hover{background:#2a4a7f}
#stats{position:fixed;top:12px;right:12px;z-index:10;display:flex;gap:6px}
.pill{background:rgba(8,14,26,.88);border:1px solid #1a2744;border-radius:12px;padding:4px 10px;font-size:11px;display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pill b{color:#fff}
#status{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(8,14,26,.88);border:1px solid #1a2744;border-radius:8px;padding:6px 16px;font-size:11px;color:#5a6d8a;text-align:center}
#status b{color:#c8d6e5}
#loading{position:fixed;inset:0;z-index:99;background:#060e1a;display:flex;flex-direction:column;align-items:center;justify-content:center}
#loading .spin{width:32px;height:32px;border:3px solid #1a2744;border-top-color:#38bdf8;border-radius:50%;animation:sp 1s linear infinite}
#loading p{margin-top:10px;font-size:12px;color:#5a6d8a}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><p>Loading 3D Antarctic View…</p></div>

<div id="hud">
  <h2>🧊 Antarctic 3D View</h2>
  <p>Click the <b style="color:#38bdf8">ocean</b> to set start, then click again for destination. Route auto-computes.</p>
  <a href="/">← Back to 2D Map</a>
</div>

<div id="stats">
  <div class="pill"><div class="dot" style="background:#ff8c1a"></div>Icebergs: <b id="s-bergs">—</b></div>
  <div class="pill"><div class="dot" style="background:#38bdf8"></div>SIC: <b id="s-sic">—</b></div>
  <div class="pill"><div class="dot" style="background:#f87171"></div>Risk: <b id="s-risk">—</b></div>
</div>

<div id="status"><b>Click ocean to plan a route</b></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// --- Config ---
var REG = {lon_min:-65, lon_max:-35, lat_min:-70, lat_max:-60};
var SC = 0.15;

// --- Three.js setup ---
var cv = document.createElement('canvas');
document.body.appendChild(cv);
var W = window.innerWidth, H = window.innerHeight;
var R = new THREE.WebGLRenderer({canvas: cv, antialias: true});
R.setSize(W, H);
R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.shadowMap.enabled = true;
R.toneMapping = THREE.ACESFilmicToneMapping;

var S = new THREE.Scene();
S.background = new THREE.Color(0x060e1a);
S.fog = new THREE.FogExp2(0x0a1828, 0.01);

var cam = new THREE.PerspectiveCamera(50, W/H, 0.1, 500);
cam.position.set(20, 22, 32);
cam.lookAt(0, 0, 0);

// --- Lighting ---
S.add(new THREE.AmbientLight(0x334466, 0.5));
var sun = new THREE.DirectionalLight(0xffeedd, 1);
sun.position.set(25, 35, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
S.add(sun);
S.add(new THREE.HemisphereLight(0x87ceeb, 0x1a3a5c, 0.3));

// --- Ocean ---
var OCEAN = 120;
var oGeo = new THREE.PlaneGeometry(OCEAN, OCEAN, 150, 150);
oGeo.rotateX(-Math.PI/2);
var oMat = new THREE.ShaderMaterial({
  uniforms: {uTime: {value: 0}, uWH: {value: 0.3}},
  vertexShader: 'uniform float uTime,uWH;void main(){vec3 p=position;p.y+=sin(p.x*.3+uTime*.8)*uWH+sin(p.z*.2+uTime*.6)*uWH*.7+cos((p.x+p.z)*.15+uTime)*uWH*.4;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}',
  fragmentShader: 'void main(){gl_FragColor=vec4(0.02,0.08+gl_FragCoord.y*.0001,0.15,.92);}',
  transparent: true, side: THREE.DoubleSide
});
var ocean = new THREE.Mesh(oGeo, oMat);
ocean.receiveShadow = true;
S.add(ocean);

// --- Helpers ---
function ll2w(lon, lat) {
  return {x: (lon - (REG.lon_min+REG.lon_max)/2) * SC, z: (lat - (REG.lat_min+REG.lat_max)/2) * SC};
}

// --- Ship ---
var shipGroup = null;
function makeShip() {
  var g = new THREE.Group();
  // Hull
  var hull = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 0.5, 0.6),
    new THREE.MeshPhysicalMaterial({color: 0x2a4a6b, roughness: 0.4, metalness: 0.3})
  );
  hull.castShadow = true;
  g.add(hull);
  // Bridge
  var bridge = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 0.2, 0.2),
    new THREE.MeshPhysicalMaterial({color: 0x4fb3ff, roughness: 0.2, metalness: 0.5})
  );
  bridge.position.set(0, 0.3, 0);
  g.add(bridge);
  // Light
  var light = new THREE.Mesh(
    new THREE.SphereGeometry(0.04),
    new THREE.MeshBasicMaterial({color: 0x34d399})
  );
  light.position.set(0, 0.45, 0);
  g.add(light);
  g.scale.set(0.7, 0.7, 0.7);
  return g;
}

// --- State ---
var bergs = [], trailMesh = null, routeLine = null, routeGlow = null;
var sP = null, eP = null, shipPos = null, shipOn = false, shipI = 0, routePts = [];
var camAngle = 0, camRadius = 35, camHeight = 22;
var dragging = false, lastMouse = {x:0, y:0};

// --- Mouse controls ---
cv.onmousedown = function(e) { dragging = true; lastMouse = {x: e.clientX, y: e.clientY}; };
cv.onmouseup = cv.onmouseleave = function() { dragging = false; };
cv.onmousemove = function(e) {
  if (!dragging) return;
  camAngle += (e.clientX - lastMouse.x) * 0.005;
  camHeight = Math.max(5, Math.min(50, camHeight - (e.clientY - lastMouse.y) * 0.1));
  lastMouse = {x: e.clientX, y: e.clientY};
};
cv.onwheel = function(e) { camRadius = Math.max(10, Math.min(80, camRadius + e.deltaY * 0.03)); };

// --- Click to place points ---
var ray = new THREE.Raycaster(), mVec = new THREE.Vector2();
cv.onclick = function(e) {
  var rc = cv.getBoundingClientRect();
  mVec.x = ((e.clientX - rc.left) / rc.width) * 2 - 1;
  mVec.y = -((e.clientY - rc.top) / rc.height) * 2 + 1;
  ray.setFromCamera(mVec, cam);
  var hits = ray.intersectObject(ocean);
  if (!hits.length) return;
  var pt = hits[0].point;

  if (!sP) {
    sP = pt.clone();
    addMarker(pt, 0x34d399);
    setStatus('Start set — click destination');
  } else if (!eP) {
    eP = pt.clone();
    addMarker(pt, 0xf87171);
    setStatus('Computing route…');
    computeRoute();
  } else {
    resetAll();
    sP = pt.clone();
    addMarker(pt, 0x34d399);
    setStatus('Start set — click destination');
  }
};

function addMarker(p, color) {
  var m = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25, 0.25, 0.4, 12),
    new THREE.MeshBasicMaterial({color: color})
  );
  m.position.set(p.x, 0.5, p.z);
  S.add(m);
}

function setStatus(t) { document.getElementById('status').innerHTML = '<b>' + t + '</b>'; }

function resetAll() {
  sP = null; eP = null; shipOn = false; shipI = 0; routePts = [];
  if (routeLine) { S.remove(routeLine); routeLine = null; }
  if (routeGlow) { S.remove(routeGlow); routeGlow = null; }
  if (trailMesh) { S.remove(trailMesh); trailMesh = null; }
  if (shipGroup) { S.remove(shipGroup); shipGroup = null; }
  setStatus('Click ocean to plan a route');
}

// --- Route ---
async function computeRoute() {
  if (!sP || !eP) return;
  var sl = sP.x/SC + (REG.lon_min+REG.lon_max)/2;
  var sla = sP.z/SC + (REG.lat_min+REG.lat_max)/2;
  var el = eP.x/SC + (REG.lon_min+REG.lon_max)/2;
  var ela = eP.z/SC + (REG.lat_min+REG.lat_max)/2;
  try {
    var r = await fetch('/recommend_route?start_lon='+sl+'&start_lat='+sla+'&end_lon='+el+'&end_lat='+ela).then(function(x){return x.json()});
    if (r.recommended_route && r.recommended_route.success) {
      var wps = r.recommended_route.waypoints;
      var pts = wps.map(function(w) {
        var p = ll2w(w[0], w[1]);
        return new THREE.Vector3(p.x, 0.6, p.z);
      });
      // Draw route line
      var curve = new THREE.CatmullRomCurve3(pts);
      var spPts = curve.getPoints(pts.length * 3);
      routePts = spPts;
      routeGlow = new THREE.Mesh(
        new THREE.TubeGeometry(curve, spPts.length, 0.12, 6, false),
        new THREE.MeshBasicMaterial({color: 0x38bdf8, transparent: true, opacity: 0.2})
      );
      S.add(routeGlow);
      routeLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(spPts),
        new THREE.LineBasicMaterial({color: 0x38bdf8})
      );
      S.add(routeLine);
      // Start ship
      shipGroup = makeShip();
      shipGroup.position.copy(spPts[0]);
      S.add(shipGroup);
      shipOn = true;
      shipI = 0;
      setStatus('Route ready — ship sailing');
    } else {
      setStatus('No safe route found');
    }
  } catch(e) {
    setStatus('API offline');
  }
}

// --- Icebergs ---
function addBerg(lon, lat, name) {
  var p = ll2w(lon, lat);
  var g = new THREE.Group();
  // Above water
  var top = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.8, 0),
    new THREE.MeshPhysicalMaterial({color: 0xd4eef8, roughness: 0.15, metalness: 0.05, clearcoat: 0.8})
  );
  top.scale.set(1, 0.5, 1);
  top.position.y = 0.4;
  top.castShadow = true;
  g.add(top);
  // Below water (bigger, translucent)
  var bot = new THREE.Mesh(
    new THREE.DodecahedronGeometry(1.5, 1),
    new THREE.MeshPhysicalMaterial({color: 0x2a6090, roughness: 0.3, transparent: true, opacity: 0.3})
  );
  bot.scale.set(1, 1.2, 1);
  bot.position.y = -1.2;
  g.add(bot);

  var sz = 0.3 + Math.random() * 0.5;
  g.scale.set(sz, sz, sz);
  g.position.set(p.x, 0, p.z);
  g.userData = {phase: Math.random() * Math.PI * 2, speed: 0.001 + Math.random() * 0.002};
  S.add(g);
  bergs.push(g);
}

// --- Boot ---
async function boot() {
  try {
    // Fetch data
    var res = await fetch('/recommend_route').then(function(r){return r.json()});
    var d1 = res.sic_forecast_summary['day+1'];
    document.getElementById('s-sic').textContent = d1 ? d1.mean_sic_pct + '%' : '—';
    document.getElementById('s-risk').textContent = res.risk_summary.pct_region_high_risk + '%';

    // Icebergs
    var bd = await fetch('/iceberg_trajectories').then(function(r){return r.json()});
    var count = 0;
    for (var nm in bd) {
      if (bd[nm].lats && bd[nm].lats.length > 0) {
        addBerg(bd[nm].lons[0], bd[nm].lats[0], nm);
        count++;
      }
    }
    document.getElementById('s-bergs').textContent = count;
  } catch(e) {}

  document.getElementById('loading').style.display = 'none';
}

// --- Animate ---
var time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.016;

  // Ocean waves
  oMat.uniforms.uTime.value = time;

  // Camera orbit
  cam.position.x = Math.sin(camAngle) * camRadius;
  cam.position.z = Math.cos(camAngle) * camRadius;
  cam.position.y = camHeight;
  cam.lookAt(0, 0, 0);
  camAngle += 0.0008;

  // Iceberg drift
  bergs.forEach(function(b) {
    b.position.x += Math.sin(time * b.userData.speed + b.userData.phase) * 0.002;
    b.position.z += Math.cos(time * b.userData.speed * 0.7 + b.userData.phase) * 0.001;
    b.position.y = Math.sin(time * 0.5 + b.userData.phase) * 0.04;
    b.rotation.y += 0.0005;
  });

  // Ship sailing
  if (shipOn && shipGroup && routePts.length > 1) {
    shipI += 0.6;
    var idx = Math.floor(shipI);
    if (idx >= routePts.length - 1) {
      shipOn = false;
      setStatus('Voyage complete');
    } else {
      var frac = shipI - idx;
      shipGroup.position.lerpVectors(routePts[idx], routePts[Math.min(idx+1, routePts.length-1)], frac);
      shipGroup.position.y = 0.3 + Math.sin(time * 3) * 0.06;
      // Face direction
      var dir = new THREE.Vector3().subVectors(routePts[Math.min(idx+1, routePts.length-1)], routePts[idx]).normalize();
      shipGroup.rotation.y = Math.atan2(dir.x, dir.z) + Math.PI;
      // Trail
      if (trailMesh) S.remove(trailMesh);
      var tPts = routePts.slice(0, idx + 1).concat([shipGroup.position.clone()]);
      trailMesh = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(tPts),
        new THREE.LineBasicMaterial({color: 0x34d399, transparent: true, opacity: 0.7})
      );
      S.add(trailMesh);
    }
  }

  R.render(S, cam);
}

// --- Resize ---
window.onresize = function() {
  W = window.innerWidth; H = window.innerHeight;
  cam.aspect = W/H; cam.updateProjectionMatrix();
  R.setSize(W, H);
};

animate();
boot();
</script>
</body>
</html>
